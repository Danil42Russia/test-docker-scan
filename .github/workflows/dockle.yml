name: Dockle

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/dockle.yml

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  scan:
    name: Dockle / ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image:
          - localton
          - verifier
          - faucet
          - actonscan-backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run Dockle
        id: scan
        uses: docker://goodwithtech/dockle:latest
        with:
          args: >-
            --exit-code 0
            --format sarif
            --output dockle.sarif
            ghcr.io/ton-blockchain/${{ matrix.image }}:latest

      - name: Upload SARIF to GitHub Code Scanning
        if: ${{ !cancelled() && steps.scan.outcome == 'success' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: dockle.sarif
          category: dockle-${{ matrix.image }}

      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: dockle-${{ matrix.image }}
          path: dockle.sarif
          if-no-files-found: warn
          retention-days: 30
